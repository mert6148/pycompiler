<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101114">
    <meta name="description" content="PyCompiler Studio derleyici arayüzünü açın.">
    <meta http-equiv="refresh" content="0; url=../index.html">
    <title>PyCompiler Studio</title>
    <link rel="canonical" href="../index.html">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", sans-serif;
        background: #101114;
        color: #efeff2;
        --accent: #c4f46a;
      }

      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        margin: 0;
        padding: 24px;
        background: radial-gradient(ellipse at 50% 30%, #20211c, transparent 36rem), #101114;
      }
      main { width: min(100%, 520px); text-align: center; }
      .brand { color: var(--accent); font: 500 16px Consolas, monospace; }
      h1 { margin: 22px 0 10px; font-size: clamp(32px, 8vw, 48px); letter-spacing: -2px; }
      h1 span { color: var(--accent); }
      p { margin: 0; color: #a8a9b2; line-height: 1.7; }
      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        margin-top: 26px;
        padding: 0 18px;
        border-radius: 7px;
        background: var(--accent);
        color: #181b11;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
      .note { margin-top: 17px; font-size: 12px; }
    </style>
    <script>
      window.location.replace(new URL("../index.html", window.location.href));
    </script>
  </head>
  <body>
    <main>
      <div class="brand" aria-hidden="true">&lt;/&gt; pycompiler.</div>
      <h1>Yaz. <span>Dönüştür.</span></h1>
      <p>PyCompiler Studio açılıyor. Eğitim dilindeki programını Python, JavaScript, C++, C# veya PHP kaynak koduna dönüştür.</p>
      <a href="../index.html">Derleyici arayüzünü aç</a>
      <p class="note">Sayfa açılmazsa yukarıdaki düğmeyi kullanın.</p>
    </main>
  </body>
</html>
